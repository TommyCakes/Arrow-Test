<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Log</title>
  <meta name="description" content="A running log of notes, updates and thoughts." />

  <!-- Raleway font (loaded from Google Fonts; falls back to system fonts offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#log">Skip to entries</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <div>
          <h1 class="site-title">The Log</h1>
          <p class="site-tagline">Notes, updates &amp; things worth remembering.</p>
        </div>
      </div>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="theme-toggle-icon" aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <main class="wrap" id="log">
    <div class="toolbar">
      <label class="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search the log…" aria-label="Search entries" />
      </label>
      <div id="tag-filters" class="tag-filters" aria-label="Filter by tag"></div>
    </div>

    <ol id="entries" class="entries" aria-live="polite"></ol>

    <p id="empty" class="empty" hidden>No entries match your search.</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Built with plain HTML, CSS &amp; JS · Hosted free on GitHub Pages</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
